[project]
name = "rtrl-flight"
version = "0.1.0"
description = "RTRL flight surface controller (Cessna 172 / JSBSim) with BPTT-LSTM and PID baselines"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4,<2.14",  # torch 2.14 fails to load its DLLs on Windows as of 2026-09; revisit when fixed
    "gymnasium>=0.29",
    "jsbgym",
    "hydra-core>=1.3",
    "wandb>=0.17",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtrl_flight"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
