# Top-level Hydra config. Per agent_docs/architecture.md: configs live under
# configs/{controller,env,experiment}/ and every run selects one of each
# explicitly via `+controller=...`, `+env=...`, `+experiment=...` -- there is
# deliberately no default controller/env/experiment declared here (an empty
# defaults list beyond _self_), so a run can never silently pick up a group
# it didn't ask for. This matches CLAUDE.md's "One Hydra config per
# experiment" -- nothing hidden, nothing implicit.
#
# (Declaring `controller: null` etc. in this defaults list is the more
# common Hydra pattern, but it requires selecting a value with plain
# `controller=pid`, not `+controller=pid` -- confirmed by compose() raising
# "Multiple values for controller" otherwise. Left out entirely so `+` works
# as expected for every group.)
defaults:
  - _self_

seed: 0

# Declared here (not under configs/training/) so `training.episodes=50` etc.
# work as plain overrides from scripts/train_bptt.py -- unlike controller/
# env/experiment, training hyperparameters aren't a "select one of several
# named variants" group, just a few scalars every training entrypoint needs.
training:
  episodes: 50
  epochs: 20
  lr: 1e-3
  batch_size: 8
  checkpoint_path: data/checkpoints/bptt_lstm_pretrain.pt
  # Below: scripts/train_rtrl_warmstart.py. checkpoint_path above doubles as
  # the BPTT checkpoint to warm-start FROM (same artifact train_bptt.py
  # produces); output_checkpoint is RTU's own save path, kept distinct since
  # the two scripts read/write different files.
  n_episodes: 20
  save_every: 5
  output_checkpoint: data/checkpoints/rtrl_rtu_online.pt
